{% extends "base.html" %}{% block content %}
{% if student %}<h3>Expediente: {{ student.first_name }} {{ student.last_name }} ({{ student.student_id }})</h3>
<table><tr><th>Curso</th><th>Nota</th></tr>
{% for g in grades %}<tr><td>{{ g.course }}</td><td>{{ g.grade }}</td></tr>{% endfor %}</table>
{% else %}<p>Estudiante no encontrado.</p>{% endif %}
{% endblock %}
