<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Portal Universitario (Laboratorio)</title>
<style>body{font-family:Arial;max-width:800px;margin:30px auto}nav a{margin-right:12px}

<body>
<h2>Portal Universitario (Laboratorio)</h2>

{% block content %}{% endblock %}
</body></html>
